# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

upcoming_soon:
  title: Upcoming soon
  description: Starts tomorrow.
  starts_at: <%= 1.day.from_now %>
  ends_at: <%= 1.day.from_now + 2.hours %>
  location: London
  virtual: false

upcoming_later:
  title: Upcoming later
  description: Starts next week.
  starts_at: <%= 1.week.from_now %>
  virtual: true

past:
  title: Already happened
  description: Was last week.
  starts_at: <%= 1.week.ago %>
  ends_at: <%= 1.week.ago + 1.hour %>
  location: Manchester
  virtual: false
